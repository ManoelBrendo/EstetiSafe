name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

# Cancela execuções do mesmo PR para economizar minutos de CI
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/backend/package-lock.json

      - name: Install dependencies
        run: npm ci


      - name: Verify production preflight
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://postgres:postgres@db.lappui.example:5432/lappui
          JWT_SECRET: 1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef
          FRONTEND_URL: https://app.lappui.example
          SUPPORT_ADMIN_EMAIL: support@lappui.example
          SUPPORT_ADMIN_PASSWORD: A!@246813579246
          SUPPORT_CONTACT_EMAIL: support@lappui.example
          SUPPORT_CONTACT_PHONE: 5511999999999
          BILLING_GATEWAY_PROVIDER: provider-configured
          BILLING_WEBHOOK_SECRET: abcdef1234567890abcdef1234567890abcdef1234567890
          WHATSAPP_CONFIRMATION_JOB_ENABLED: "false"
        run: npm run verify:prod

      - name: Typecheck backend
        run: npm run typecheck

      - name: Lint backend
        run: npm run lint

      - name: Test backend
        run: npm test

  backend-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lappui_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d lappui_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    defaults:
      run:
        working-directory: backend/backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lappui_ci
      JWT_SECRET: ci-integration-secret
      FRONTEND_URL: http://localhost:4173
      SUPPORT_ADMIN_EMAIL: support.integration@lappui.local
      SUPPORT_ADMIN_PASSWORD: A!@246813579246
      SUPPORT_ADMIN_NAME: Central de suporte teste
      SUPPORT_CONTACT_EMAIL: support.integration@lappui.local
      SUPPORT_CONTACT_PHONE: 5511999999999
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run backend integration tests
        run: npm run test:integration

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: https://api.estetisafe.com.br

      - name: Verificar tamanho do bundle
        run: |
          echo "📦 Tamanho dos assets de build:"
          du -sh dist/assets/* 2>/dev/null | sort -rh | head -15 || echo "Nenhum asset gerado"

  # ----------------------------------------------------------
  # Job: Validação do Dockerfile (build sem push)
  # ----------------------------------------------------------
  docker-build:
    name: Docker — Build de imagem
    runs-on: ubuntu-latest
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build da imagem Docker (sem push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: estetisafe-backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: runner