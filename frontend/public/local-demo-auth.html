<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Local Demo Auth</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f7efe5;
      color: #241a15;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .card {
      width: min(520px, calc(100vw - 32px));
      padding: 24px;
      border-radius: 24px;
      background: rgba(255, 252, 247, 0.95);
      border: 1px solid rgba(139, 98, 50, 0.16);
      box-shadow: 0 20px 50px rgba(55, 36, 18, 0.12);
      line-height: 1.6;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 1.4rem;
    }

    p {
      margin: 0;
      color: #5e4f45;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Preparando demo local</h1>
    <p>Ativando a sessão local e redirecionando para o painel.</p>
  </main>

  <script>
    (function () {
      const allowedHosts = new Set(['localhost', '127.0.0.1', '10.0.2.2'])
      if (!allowedHosts.has(window.location.hostname)) {
        document.body.innerHTML = '<main class="card"><h1>Indisponível fora do ambiente local</h1><p>Este atalho existe apenas para demonstração local do SaaS.</p></main>'
        return
      }

      const params = new URLSearchParams(window.location.search)
      const token = params.get('token')
      const user = params.get('user')
      const redirect = params.get('redirect') || '/'

      if (!token || !user) {
        document.body.innerHTML = '<main class="card"><h1>Dados da sessão ausentes</h1><p>Forneça token e user na query string para abrir a demo local.</p></main>'
        return
      }

      localStorage.setItem('lappui_token', token)
      localStorage.setItem('lappui_user', user)
      localStorage.removeItem('estetisafe_token')
      localStorage.removeItem('estetisafe_user')
      localStorage.removeItem('lappui_support_session')

      window.setTimeout(() => {
        window.location.replace(redirect)
      }, 150)
    })()
  </script>
</body>
</html>
