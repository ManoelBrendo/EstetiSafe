<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>L'Appui offline</title>
    <style>
      :root { color-scheme: light; --ink: #2a1f17; --muted: #8a7667; --gold: #9f6a2f; --paper: #fffaf3; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: Georgia, 'Times New Roman', serif; color: var(--ink); background: radial-gradient(circle at top left, #fff4dd, var(--paper) 42%, #f1e3d1); }
      main { width: min(520px, 100%); padding: 34px; border: 1px solid rgba(159, 106, 47, 0.18); border-radius: 28px; background: rgba(255, 255, 255, 0.72); box-shadow: 0 24px 70px rgba(42, 31, 23, 0.12); }
      .mark { width: 64px; height: 64px; display: grid; place-items: center; margin-bottom: 20px; border-radius: 20px; color: var(--gold); border: 1px solid rgba(159, 106, 47, 0.24); background: #fff7ea; font-size: 30px; }
      h1 { margin: 0; font-size: clamp(2rem, 8vw, 3.2rem); line-height: 0.95; }
      p { margin: 16px 0 0; color: var(--muted); line-height: 1.7; font-family: Arial, sans-serif; }
      small { display: block; margin-top: 20px; color: var(--gold); letter-spacing: 0.12em; text-transform: uppercase; font-family: Arial, sans-serif; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">L</div>
      <h1>Conexao indisponivel</h1>
      <p>O L'Appui guardou a estrutura principal do app. Assim que a internet voltar, atualize a pagina para sincronizar dados da clinica com seguranca.</p>
      <small>Modo instalavel PWA</small>
    </main>
  </body>
</html>
