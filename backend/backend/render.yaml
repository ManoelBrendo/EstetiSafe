services:
  - type: web
    name: lappui-backend
    env: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lappui-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://seu-app.vercel.app
      - key: NODE_ENV
        value: production

databases:
  - name: lappui-db
    plan: free
    databaseName: lappui
